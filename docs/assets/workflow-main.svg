<svg xmlns="http://www.w3.org/2000/svg" viewBox="135 0 1365 1290" width="1365" height="1290" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">MetaPathways: annotation, abundance, pathway inference and exploration</title>
  <desc id="workflow-desc">Six conceptual modules extend the appnote workflow: preprocessing; sequence feature prediction; functional and taxonomic annotation; optional community and genome pathway inference; optional read abundance; and integrated reports and explorer. Nextflow schedules local or Slurm tasks. Assemblies and references are required; reads, genome maps and licensed pathway inference are optional. Numbered modules are not an execution schedule.</desc>
