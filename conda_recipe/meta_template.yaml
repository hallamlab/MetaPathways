package:
  name: <NAME>
  version: <VERSION>

source:
  url: <TAR>
  sha256: <SHA256>

build:
  # The bundled FAST/metacount executables target Linux x86-64.
  skip: true  # [not (linux and x86_64)]
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
  entry_points:
<ENTRY>

test:
  imports:
    - metapathways
  commands:
    - metapathways version
    - metapathways run --help
    - metapathways build_db --help

requirements:
  host:
    - python=3.10
    - pip
    - setuptools <81
    - wheel
  run:
    - libgcc
    - libstdcxx
<REQUIREMENTS>

about:
  home: https://github.com/hallamlab/MetaPathways/
  summary: metagenomics pipeline
  license: MIT
  license_file: LICENSE
