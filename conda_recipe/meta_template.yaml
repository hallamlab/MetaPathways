package:
  name: <NAME>
  version: <VERSION>

source:
  - url: <TAR>
    sha256: <SHA256>
<HELPER_SOURCES>

build:
  # The bundled FAST/metacount executables target Linux x86-64.
  skip: true  # [not (linux and x86_64)]
  number: 0
  script:
    - "{{ PYTHON }} -m pip install helper-sources/magsplitter helper-sources/camelot-frs --no-deps --no-build-isolation -vv"
    - "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
  entry_points:
<ENTRY>

test:
  imports:
    - metapathways
  commands:
    - magsplitter --help
    - python -c "import camelot_frs"
    - metapathways prepare_test --help
    - metapathways version
    - metapathways run --help
    - metapathways build_db --help
    - metapathways analysis_wf --help
    - metapathways build_pt --help
    - metapathways mag_split --help
    - metapathways ptools --help
    - metapathways report --help
    - nextflow -version

requirements:
  host:
    - python=3.11
    - pip
    - setuptools >=83,<85
    - wheel
    - setuptools-scm >=6.2
  run:
    - libgcc
    - libstdcxx
<REQUIREMENTS>

about:
  home: https://github.com/hallamlab/MetaPathways/
  summary: metagenomics pipeline
  license: MIT AND MPL-2.0
  license_file:
    - LICENSE
    - helper-sources/camelot-frs/LICENSE
