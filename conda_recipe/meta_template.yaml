package:
  name: <NAME>
  version: <VERSION>

source:
  url: <TAR>
  
build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install git+https://github.com/hallamlab/MAGSplitter.git@main &&
          {{ PYTHON }} -m pip install git+https://bitbucket.org/tomeraltman/camelot-frs@dev#egg=camelot-frs &&
          {{ PYTHON }} -m pip install git+https://github.com/pepkit/pephubclient.git &&
          {{ PYTHON }} -m pip install . -vv
  entry_points:
<ENTRY>

test:
  imports:
    - metapathways
  commands:
    #- pip check # this is not working right now
    - metapathways --help
  requires:
    - pip

requirements:
  host:
    - python=3.10
    - pip

  run:
<REQUIREMENTS>

about:
  home: https://bitbucket.org/BCB2/metapathways/
  summary: metagenomics pipeline
  license: 'MIT'
  license_file: ../LICENSE
