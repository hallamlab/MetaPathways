name: Package and documentation smoke tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install build, documentation, and CLI import dependencies
        run: >-
          python -m pip install build 'setuptools<81' wheel
          pandas pybedtools pyfastx tqdm scipy -r docs/requirements.txt
      - name: Test release controls
        run: python -m unittest discover -s tests/release -v
      - name: Build source and wheel distributions
        run: python -m build --no-isolation
      - name: Check installed CLI outside the source directory
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          metapathways version
          for command in run build_db mag_split ptools; do
            metapathways "$command" -h
          done
      - name: Build documentation with warnings treated as errors
        run: sphinx-build -W --keep-going -b html docs/src docs/build
