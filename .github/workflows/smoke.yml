name: Package and documentation smoke tests

on:
  push:
    branches: [master, main, dev, "feat/**"]
  pull_request:
    branches: [master, main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pathway-tools-readiness:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@v4.1.0
        with:
          activate-environment: readiness
          python-version: '3.11'
          channels: conda-forge
          channel-priority: strict
          auto-activate: false
          conda-remove-defaults: true
      - name: Check actual Mamba runtime and pinned public dependency image
        shell: bash -el {0}
        run: |
          conda install --yes -c conda-forge apptainer
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          from metapathways.pt_setup import host_check, prepared_base, validate_base
          runtime = shutil.which('apptainer')
          host_check(runtime, Path(os.environ['RUNNER_TEMP']) / 'readiness')
          validate_base(runtime, prepared_base(runtime))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pathway-tools-readiness
          path: ${{ runner.temp }}/readiness/apptainer-check.log
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install build and CLI import dependencies
        run: >-
          python -m pip install build 'setuptools>=83,<85' wheel
          pandas pybedtools pyfastx tqdm scipy pyyaml cffconvert
      - name: Validate software citation metadata
        run: cffconvert --validate
      - name: Test release controls
        run: python -m unittest discover -s tests/release -v
      - name: Test scheduling, containers, and read mapping
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build source and wheel distributions
        run: python -m build --no-isolation
      - name: Check installed CLI outside the source directory
        run: |
          python -m pip install dist/*.whl
          cp scripts/check_installed_assets.py "$RUNNER_TEMP/check_installed_assets.py"
          cd "$RUNNER_TEMP"
          python check_installed_assets.py
          metapathways version
          magsplitter --help
          python -c "import camelot_frs"
          metapathways prepare_test -o test
          for command in prepare_test run analysis_wf build_db mag_split build_pt ptools report; do
            metapathways "$command" -h
          done
      - name: Check GitHub documentation and CLI reference
        run: python scripts/check_docs.py

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build the complete guide
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Check rendered links
        run: python scripts/check_docs_html.py docs/_build/html --readme README.md
