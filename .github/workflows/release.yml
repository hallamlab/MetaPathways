name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_anaconda:
        description: 'Publish validated Conda package to Anaconda.org'
        type: boolean
        default: false
      publish_quay:
        description: 'Publish validated container to Quay'
        type: boolean
        default: false
      publish_github:
        description: 'Publish GitHub release (may trigger linked Zenodo archiving)'
        type: boolean
        default: false
      release_tag:
        description: 'Existing version tag to build or publish (required for publishing from a branch)'
        type: string
        default: ''
      test_containers:
        description: 'Build/test Docker and SIF without enabling publication'
        type: boolean
        default: false
      source_run_id:
        description: 'Optional successful build run to reuse; requires release_tag'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate publication selections
        env:
          PUBLISH_ANACONDA: ${{ inputs.publish_anaconda || false }}
          PUBLISH_QUAY: ${{ inputs.publish_quay || false }}
          PUBLISH_GITHUB: ${{ inputs.publish_github || false }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: python3 scripts/check_release_controls.py
  build:
    needs: controls
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check recovery inputs
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [[ -n "$SOURCE_RUN_ID" && -z "$RELEASE_TAG_INPUT" ]]; then
            echo "::error::source_run_id requires release_tag."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@v4.1.0
        if: inputs.source_run_id == ''
        with:
          activate-environment: release-tools
          python-version: '3.11'
          channels: conda-forge
          channel-priority: strict
          auto-activate: false
          conda-remove-defaults: true
      - name: Install packaging tools
        if: inputs.source_run_id == ''
        run: |
          conda install --yes --override-channels -c conda-forge conda-build conda-index pyyaml 'setuptools>=83,<85' wheel
          python -m pip install build pandas pybedtools pyfastx tqdm scipy
      - name: Test release controls
        if: inputs.source_run_id == ''
        run: python -m unittest discover -s tests/release -v
      - name: Test scheduling, containers, and read mapping
        if: inputs.source_run_id == ''
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and test release
        if: inputs.source_run_id == ''
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [[ "$RELEASE_REF_TYPE" == tag || -n "$RELEASE_TAG_INPUT" ]]; then
            python scripts/release.py build --tag "$RELEASE_TAG"
          else
            python scripts/release.py build
          fi
      - uses: actions/setup-python@v6
        if: inputs.source_run_id != ''
        with:
          python-version: '3.11'
      - name: Recover previously tested assets
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: dist/release
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify recovered assets against the original source commit
        if: inputs.source_run_id != ''
        run: python scripts/release.py verify-artifacts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
      - name: Retain diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-diagnostics
          path: dist/release/
          if-no-files-found: ignore

  github-release:
    environment: release
    needs: [build, containers]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_github
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Use the workflow revision for fixes, verifying artifacts against the
      # original release tag rather than moving or rewriting that tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: dist/release
      - name: Publish or resume GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python scripts/release.py github-release "$RELEASE_TAG"

  anaconda:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_anaconda
    environment: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@v4.1.0
        with:
          activate-environment: upload-tools
          python-version: '3.11'
          channels: conda-forge
          auto-activate: false
          conda-remove-defaults: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: dist/release
      - name: Install uploader
        shell: bash -el {0}
        run: conda install --yes --override-channels -c conda-forge anaconda-client
      - name: Upload validated package
        shell: bash -el {0}
        env:
          ANACONDA_OWNER: ${{ vars.ANACONDA_OWNER || 'hallamlab' }}
          BINSTAR_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ -z "$BINSTAR_API_TOKEN" ]]; then
            echo "::error::Set the ANACONDA_API_TOKEN secret before selecting publish_anaconda."
            exit 1
          fi
          python scripts/release.py upload-conda --ref "$RELEASE_TAG"

  containers:
    needs: build
    if: inputs.test_containers || inputs.publish_quay || inputs.publish_github
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: dist/release
      - name: Install Apptainer
        run: |
          sudo add-apt-repository --yes ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install --yes apptainer
      - name: Build Docker and Apptainer; validate containers
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [[ "$RELEASE_REF_TYPE" == tag || -n "$RELEASE_TAG_INPUT" ]]; then
            python scripts/release.py container-build --ref "$RELEASE_TAG"
          else
            python scripts/release.py container-build
          fi
      - name: Scan container for fixable high and critical vulnerabilities
        run: |
          mkdir -p dist/security
          scanner_dir="$RUNNER_TEMP/metapathways-trivy"
          mkdir -p "$scanner_dir"
          curl --fail --silent --show-error --location \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            --output "$scanner_dir/trivy.tar.gz"
          printf '%s  %s\n' \
            2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a \
            "$scanner_dir/trivy.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/trivy.tar.gz" -C "$scanner_dir" trivy
          image=$(python -c 'import json; print(json.load(open("dist/containers/container-validation.json"))["image_id"])')
          "$scanner_dir/trivy" image --scanners vuln \
            --format json --output dist/security/trivy.json "$image"
          "$scanner_dir/trivy" image --scanners vuln \
            --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output dist/security/fixable-high-critical.json "$image"
      - name: Retain vulnerability scan report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: container-security-report
          path: dist/security/
          if-no-files-found: ignore
      - name: Export tested Docker image for independent publication
        run: |
          set -o pipefail
          image=$(python -c 'import json; print(json.load(open("dist/containers/container-validation.json"))["image"])')
          docker save "$image" | gzip > dist/containers/docker-image.tar.gz
          cd dist/containers
          sha256sum docker-image.tar.gz >> container-SHA256SUMS
      - name: Retain container assets and diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: container-assets
          path: dist/containers/
          if-no-files-found: warn

  github-containers:
    needs: [containers, github-release]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_github
    permissions:
      contents: write
    environment: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: dist/release
      - uses: actions/download-artifact@v8.0.1
        with:
          name: container-assets
          path: dist/containers
      - name: Attach validated SIF and checksums to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python scripts/release.py container-attach --ref "$RELEASE_TAG"

  quay:
    needs: containers
    if: github.event_name == 'workflow_dispatch' && inputs.publish_quay
    environment: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: dist/release
      - uses: actions/download-artifact@v8.0.1
        with:
          name: container-assets
          path: dist/containers
      - name: Verify and load the tested Docker image
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python scripts/release.py container-verify --ref "$RELEASE_TAG"
          docker load -i dist/containers/docker-image.tar.gz
      - name: Publish Docker image to Quay
        env:
          QUAY_REPOSITORY: ${{ vars.QUAY_REPOSITORY || 'quay.io/hallamlab/metapathways' }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ -z "$QUAY_USERNAME" || -z "$QUAY_PASSWORD" ]]; then
            echo "::error::Set QUAY_USERNAME and QUAY_PASSWORD secrets before selecting publish_quay."
            exit 1
          fi
          export DOCKER_CONFIG="$RUNNER_TEMP/metapathways-docker-auth"
          mkdir -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$QUAY_PASSWORD" | docker login quay.io --username "$QUAY_USERNAME" --password-stdin
          python scripts/release.py container-push --ref "$RELEASE_TAG"
      - name: Synchronize Quay repository overview
        env:
          QUAY_API_TOKEN: ${{ secrets.QUAY_API_TOKEN }}
        run: |
          if [[ -n "$QUAY_API_TOKEN" ]]; then
            python scripts/release.py quay-description
          else
            echo "::notice::Set QUAY_API_TOKEN to synchronize docker/README.quay.md, or paste it into Quay manually."
          fi
